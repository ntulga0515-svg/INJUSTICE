<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>INJUSTICE — Manage</title>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(139,53,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 50%,
            rgba(255,23,68,.14),
            transparent 30%
        ),
        #050507;

    color:#f5f5f5;

    font-family:'Rajdhani',sans-serif;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.035;

    background-image:
        linear-gradient(
            rgba(255,255,255,.5) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.5) 1px,
            transparent 1px
        );

    background-size:45px 45px;

}

nav{

    position:sticky;

    top:0;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 7%;

    background:rgba(5,5,7,.85);

    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.06);

}

.logo{

    font-family:'Orbitron';

    font-weight:900;

    letter-spacing:4px;

    font-size:22px;

}

.logo span{
    color:#ff1744;
}

.nav-links{

    display:flex;

    gap:12px;

}

.nav-btn{

    padding:10px 18px;

    color:white;

    text-decoration:none;

    border:1px solid #29232e;

    border-radius:8px;

    background:#111018;

    font-weight:700;

    transition:.2s;

}

.nav-btn:hover{

    border-color:#ff1744;

    transform:translateY(-2px);

}

.container{

    width:min(1100px,90%);

    margin:auto;

    padding:70px 0;

}

.title{

    text-align:center;

    margin-bottom:50px;

}

.title small{

    color:#ff1744;

    font-family:'Orbitron';

    letter-spacing:4px;

}

.title h1{

    margin-top:10px;

    font-family:'Orbitron';

    font-size:clamp(40px,7vw,75px);

    background:
        linear-gradient(
            100deg,
            #fff,
            #ff1744,
            #8b35ff
        );

    -webkit-background-clip:text;

    color:transparent;

}

.manage-card{

    background:
        linear-gradient(
            145deg,
            rgba(20,17,25,.96),
            rgba(9,8,12,.96)
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;

    padding:28px;

    margin-bottom:25px;

}

.manage-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-bottom:25px;

}

.manage-header h2{

    font-family:'Orbitron';

}

.user{

    color:#999;

}

.user strong{
    color:white;
}

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

button,
.action{

    border:none;

    cursor:pointer;

    padding:12px 20px;

    border-radius:8px;

    font-family:'Rajdhani';

    font-weight:800;

    color:white;

    text-decoration:none;

}

.tier-btn{

    background:
        linear-gradient(
            100deg,
            #8b001d,
            #ff1744
        );

}

.logout{

    background:#17131d;

    border:1px solid #302936;

}

.application{

    border:1px solid rgba(255,255,255,.07);

    background:#0d0a11;

    border-radius:14px;

    padding:22px;

    margin-bottom:15px;

}

.application h3{

    font-family:'Orbitron';

    margin-bottom:15px;

}

.info{

    display:grid;

    gap:8px;

    color:#aaa;

}

.info strong{
    color:white;
}

.application-actions{

    display:flex;

    gap:10px;

    margin-top:20px;

}

.approve{

    background:#137333;

}

.reject{

    background:#8b001d;

}

.empty{

    text-align:center;

    color:#777;

    padding:30px;

}

@media(max-width:600px){

    .manage-header{

        align-items:flex-start;

        flex-direction:column;

    }

    .application-actions{

        flex-direction:column;

    }

    .application-actions button{

        width:100%;

    }

}

</style>

</head>


<body>


<nav>

<div class="logo">
INJUST<span>ICE</span>
</div>

<div class="nav-links">

<a
class="nav-btn"
href="/"
>
HOME
</a>

<a
class="nav-btn"
href="/tiers.html"
>
TIERS
</a>

</div>

</nav>


<main class="container">


<div class="title">

<small>INJUSTICE CONTROL</small>

<h1>MANAGE</h1>

</div>


<div class="manage-card">

<div class="manage-header">

<div>

<h2>APPLICATIONS</h2>

<div class="user">
LOGGED IN AS:
<strong id="username">...</strong>
</div>

</div>

<div class="actions">

<a
class="action tier-btn"
href="/tiers.html"
>
⚔ TIERS
</a>

<button
class="logout"
onclick="logout()"
>
LOGOUT
</button>

</div>

</div>


<div id="applications">

<div class="empty">
Хүсэлтүүдийг ачаалж байна...
</div>

</div>

</div>


</main>


<script>


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


async function checkLogin(){

    const response =
        await fetch(
            "/api/manage/me"
        );

    const data =
        await response.json();


    if(!data.authorized){

        window.location.href =
            "/auth/discord";

        return;

    }


    document
        .getElementById("username")
        .innerText =
        data.username ||
        "AUTHORIZED";


    loadApplications();

}


async function loadApplications(){

    const box =
        document.getElementById(
            "applications"
        );


    try{

        const response =
            await fetch(
                "/api/manage/applications"
            );


        if(!response.ok){

            box.innerHTML = `
                <div class="empty">
                    ACCESS DENIED
                </div>
            `;

            return;

        }


        const applications =
            await response.json();


        if(!applications.length){

            box.innerHTML = `
                <div class="empty">
                    Одоогоор шинэ хүсэлт алга.
                </div>
            `;

            return;

        }


        box.innerHTML =
            applications.map(app => `

                <div class="application">

                    <h3>
                        ${escapeHtml(
                            app.discord ||
                            "UNKNOWN"
                        )}
                    </h3>

                    <div class="info">

                        <div>
                            <strong>Steam:</strong>
                            <a
                                href="${escapeHtml(app.steam)}"
                                target="_blank"
                                style="color:#a56cff"
                            >
                                ${escapeHtml(app.steam)}
                            </a>
                        </div>

                        <div>
                            <strong>1st Rank:</strong>
                            ${escapeHtml(
                                app.rank || "-"
                            )}
                        </div>

                        <div>
                            <strong>FACEIT:</strong>
                            ${escapeHtml(
                                app.faceit || "-"
                            )}
                        </div>

                        <div>
                            <strong>Шалтгаан:</strong>
                            ${escapeHtml(
                                app.reason || "-"
                            )}
                        </div>

                    </div>


                    <div class="application-actions">

                        <button
                            class="approve"
                            onclick="approve('${escapeHtml(app.id)}')"
                        >
                            ✓ ЗӨВШӨӨРӨХ
                        </button>

                        <button
                            class="reject"
                            onclick="reject('${escapeHtml(app.id)}')"
                        >
                            ✕ ТАТГАЛЗАХ
                        </button>

                    </div>

                </div>

            `).join("");

    }
    catch(error){

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                Хүсэлтүүдийг ачаалж чадсангүй.
            </div>
        `;

    }

}


async function approve(id){

    if(
        !confirm(
            "Энэ хүнийг MEMBER болгох уу?"
        )
    )
        return;


    const response =
        await fetch(
            "/api/manage/approve",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({id})
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        alert(
            "✕ " +
            (
                data.message ||
                "Алдаа гарлаа."
            )
        );

        return;

    }


    alert(
        "✓ MEMBER болголоо!"
    );


    loadApplications();

}


async function reject(id){

    if(
        !confirm(
            "Энэ хүсэлтийг татгалзах уу?"
        )
    )
        return;


    const response =
        await fetch(
            "/api/manage/reject",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({id})
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        alert(
            "✕ " +
            (
                data.message ||
                "Алдаа гарлаа."
            )
        );

        return;

    }


    alert(
        "✕ Хүсэлтийг татгалзлаа."
    );


    loadApplications();

}


async function logout(){

    await fetch(
        "/api/manage/logout",
        {
            method:"POST"
        }
    );


    location.href="/";

}


checkLogin();

</script>


</body>

</html>
